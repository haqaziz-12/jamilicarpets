<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Jamili Carpets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
<div class="login-container">
<div class="login-card">
<div class="login-logo">
<h1>JAMILI<span>CARPETS</span></h1>
<p>Admin Panel</p>
</div>
<form id="loginForm" class="login-form">
<div class="form-group">
<label>Username</label>
<input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
</div>
<div class="login-error" id="loginError"></div>
<button type="submit" class="btn-login">Sign In</button>
</form>
<div class="login-hint">
<p>Default credentials: <strong>admin</strong> / <strong>jamili2026</strong></p>
<p class="login-hint-small">Change these immediately after first login in Settings.</p>
</div>
<a href="/" class="login-back">← Back to Website</a>
</div>
</div>
<script src="/admin/admin.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const error = document.getElementById('loginError');
  
  // Demo authentication (replace with Worker API in production)
  if (username === 'admin' && password === 'jamili2026') {
    sessionStorage.setItem('jamili_admin', JSON.stringify({
      user: username,
      loginTime: Date.now()
    }));
    window.location.href = '/admin/dashboard.html';
  } else {
    error.textContent = 'Invalid username or password.';
    error.style.display = 'block';
  }
});
</script>
</body>
</html>
