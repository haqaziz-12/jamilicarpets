<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Jamili Carpets Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-layout">
<aside class="admin-sidebar" id="sidebar">
<div class="sidebar-logo">
<h2>JAMILI<span>CARPETS</span></h2>
<p>Admin Panel</p>
</div>
<nav class="sidebar-nav">
<a href="/admin/dashboard.html"><span>📊</span> Dashboard</a>
<a href="/admin/products.html"><span>🧶</span> Products</a>
<a href="/admin/inquiries.html"><span>📋</span> Inquiries</a>
<a href="/admin/messages.html"><span>✉️</span> Messages</a>
<a href="/admin/settings.html" class="active"><span>⚙️</span> Settings</a>
<a href="/" target="_blank"><span>🌐</span> View Site</a>
<a href="#" onclick="logout()"><span>🚪</span> Logout</a>
</nav>
</aside>

<main class="admin-main">
<header class="admin-header">
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
<h1>Settings</h1>
</header>

<div class="admin-content">
<div class="settings-sections">

<div class="settings-section">
<h2>Contact Information</h2>
<form id="contactSettings" onsubmit="saveSettings(event)">
<div class="form-row">
<div class="form-group">
<label>WhatsApp Number</label>
<input type="text" id="setWhatsApp" value="+93 77 769 7777">
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="setEmail" value="jamili.carpets@gmail.com">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Instagram URL</label>
<input type="text" id="setInstagram" value="https://www.instagram.com/jamili_carpets">
</div>
<div class="form-group">
<label>Facebook URL</label>
<input type="text" id="setFacebook" value="https://www.facebook.com/share/1BtZF8qUvq/">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Location</label>
<input type="text" id="setLocation" value="Kabul, Afghanistan">
</div>
<div class="form-group">
<label>Business Hours</label>
<input type="text" id="setHours" value="Sat – Thu, 9:00 AM – 6:00 PM">
</div>
</div>
<button type="submit" class="btn-save">Save Changes</button>
</form>
</div>

<div class="settings-section">
<h2>Home Page Content</h2>
<form id="homeSettings" onsubmit="saveSettings(event)">
<div class="form-group">
<label>Hero Headline</label>
<input type="text" id="setHeroTitle" value="Where Tradition Meets Timeless Beauty">
</div>
<div class="form-group">
<label>Hero Subtitle</label>
<textarea id="setHeroSubtitle" rows="2">Handmade Afghan carpets crafted by master artisans — each piece a unique story of heritage, skill, and devotion woven over four decades.</textarea>
</div>
<div class="form-group">
<label>About Preview Text</label>
<textarea id="setAboutPreview" rows="3">Founded in 1980 with just two looms, Jamili Carpets has grown into one of Afghanistan's most respected carpet manufacturers.</textarea>
</div>
<button type="submit" class="btn-save">Save Changes</button>
</form>
</div>

<div class="settings-section">
<h2>Admin Account</h2>
<form id="passwordSettings" onsubmit="changePassword(event)">
<div class="form-group">
<label>Current Password</label>
<input type="password" id="currentPass" required>
</div>
<div class="form-row">
<div class="form-group">
<label>New Password</label>
<input type="password" id="newPass" required>
</div>
<div class="form-group">
<label>Confirm New Password</label>
<input type="password" id="confirmPass" required>
</div>
</div>
<button type="submit" class="btn-save">Change Password</button>
</form>
</div>

<div class="settings-section">
<h2>SEO Settings</h2>
<form id="seoSettings" onsubmit="saveSettings(event)">
<div class="form-group">
<label>Meta Title (Home Page)</label>
<input type="text" id="setMetaTitle" value="Jamili Carpets — Handmade Afghan Carpets Since 1980 | Kabul">
</div>
<div class="form-group">
<label>Meta Description</label>
<textarea id="setMetaDesc" rows="2">Jamili Carpets — authentic handmade Afghan carpets crafted in Kabul since 1980. Classic, Contemporary, Mamluk, Kilim & Geometric collections. Custom orders. Worldwide shipping.</textarea>
</div>
<button type="submit" class="btn-save">Save Changes</button>
</form>
</div>

</div>
</div>
</main>
</div>

<script src="/admin/admin.js"></script>
<script>
checkAuth();
</script>
</body>
</html>
